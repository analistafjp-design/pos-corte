<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pós-Corte Interior</title>
<meta name="description" content="Pós-Corte Interior: percorrido, Exec, Exoc, assertividade, efetividade, equipes e resultados por cidade, atualizado por arquivos Excel de uma pasta do OneDrive.">
<style>
/* Pós-Corte Interior */
:root {
  color-scheme: light;
  --bg: #f4f6f9;
  --surface: #ffffff;
  --ink: #0f172a;
  --ink-2: #475569;
  --muted: #64748b;
  --line: #e5e8ee;
  --line-strong: #cfd5df;
  --ring: #e5e8ee;
  --brand: #0f2a5c;
  --brand-2: #1e4fd6;
  --brand-tint: #eaf0fe;
  --focus: #1e4fd6;

  /* Cores por entidade (paleta categórica validada; a mesma cor em todos os gráficos) */
  --atv: #5b6675;
  --exec: #2a78d6;
  --exoc: #eb6834;
  --neg: #1baf7a;
  --termo: #4a3aa7;
  --sem: #e87ba4;
  --outros: #a8a69e;

  --ok-bg: #ecf8f0;
  --ok-ink: #14633a;
  --info-bg: #eaf0fe;
  --info-ink: #17357f;
  --warn-bg: #fff6e0;
  --warn-ink: #6b4400;
  --err-bg: #fdeeee;
  --err-ink: #9c1f1f;

  --radius: 12px;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.05);
  --font: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14.5px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -48px; background: var(--brand); color: #fff; padding: 8px 12px; border-radius: 8px; z-index: 100; }
.skip:focus { top: 8px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Estrutura ---------- */
.app { min-height: 100vh; }
.topbar { position: sticky; top: 0; z-index: 30; background: linear-gradient(180deg, #e3eeff 0%, #d5e5fc 100%); border-bottom: 1px solid #bcd3f5; }
.topbar-in { max-width: 1440px; margin: 0 auto; padding: 12px 16px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px; }
.title { display: flex; align-items: center; gap: 12px; min-width: 0; padding-bottom: 6px; }
.logo { width: 34px; height: 34px; border-radius: 9px; background: var(--brand-2); color: #fff; display: grid; place-items: center; flex: none; }
.title h1 { font-size: 17px; line-height: 1.2; font-weight: 700; letter-spacing: -0.015em; }
.title .sub { color: #3d5a86; font-size: 12.5px; }
.tabs { display: flex; gap: 2px; order: 3; width: 100%; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 9px 12px; margin-bottom: -1px;
  font-weight: 600; font-size: 14px; color: #3d5a86; white-space: nowrap; border-radius: 0;
}
.tabs button:hover { color: var(--brand); }
.tabs button[aria-current="page"] { color: var(--brand-2); border-bottom-color: var(--brand-2); }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; padding-bottom: 8px; justify-content: flex-end; }
.actions .sep { width: 1px; height: 22px; background: var(--line-strong); margin: 0 2px; }

.main-col { max-width: 1440px; margin: 0 auto; min-width: 0; padding: 16px 16px 48px; display: flex; flex-direction: column; gap: 14px; }
.srcline { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.pill strong { color: var(--ink); font-weight: 600; }
.pill svg { color: var(--muted); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 36px; padding: 6px 13px; border-radius: 9px; font-size: 13.5px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow);
}
.btn:hover { background: #f3f5f9; }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn.primary { background: var(--brand-2); border-color: var(--brand-2); color: #fff; }
.btn.primary:hover { background: #1a44b8; }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: #eef1f6; }
.ico { flex: none; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

/* ---------- Mensagens ---------- */
.status {
  display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start;
  padding: 10px 14px; border-radius: 10px; border: 1px solid transparent; font-size: 14px;
}
.status .st-title { font-weight: 700; }
.status .st-detail { font-size: 14px; margin-top: 2px; overflow-wrap: anywhere; }
.status ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
.status li { overflow-wrap: anywhere; }
.status.info { background: var(--info-bg); color: var(--info-ink); border-color: #c9d7f8; }
.status.success { background: var(--ok-bg); color: var(--ok-ink); border-color: #c6e3c6; }
.status.warning { background: var(--warn-bg); color: var(--warn-ink); border-color: #f0dc9c; }
.status.error { background: var(--err-bg); color: var(--err-ink); border-color: #f3c6c4; }
.progress { height: 6px; border-radius: 4px; background: rgba(13, 54, 107, 0.15); overflow: hidden; margin-top: 8px; }
.progress > span { display: block; height: 100%; background: var(--brand-2); border-radius: 4px; transition: width 0.15s; }
.status-actions { display: flex; gap: 6px; }

/* ---------- Filtros ---------- */
.filters {
  background: var(--surface); border: 1px solid var(--ring); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 14px 16px; display: grid; gap: 10px 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: end;
}
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 11.5px; font-weight: 600; letter-spacing: 0.02em; color: var(--muted); }
.field input, .field select {
  min-height: 38px; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 9px; background: #fff; width: 100%; min-width: 0;
}
.field.wide { grid-column: 1 / -1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; background: var(--brand-tint); color: var(--brand);
  border: 1px solid #c9d7f8; border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 13px; font-weight: 600;
}
.chip button { border: 0; background: transparent; padding: 2px; display: grid; place-items: center; border-radius: 50%; color: inherit; }
.chip button:hover { background: rgba(13, 54, 107, 0.15); }
.count-note { font-size: 13px; color: var(--ink-2); }

/* ---------- Cartões ---------- */
.card {
  background: var(--surface); border: 1px solid var(--ring); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px;
  min-width: 0;
}
.card-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px 12px; margin-bottom: 12px; }
.card h2 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.card .hint { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi {
  text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 14px 16px 13px; display: flex; flex-direction: column; gap: 3px; min-width: 0; transition: border-color 0.12s, box-shadow 0.12s;
}
button.kpi:hover { border-color: #b9c4dc; box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08); }
.kpi-label { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.kdot { width: 8px; height: 8px; border-radius: 50%; background: var(--kc, var(--atv)); flex: none; }
.kpi-go { margin-left: auto; color: #a3adbf; display: inline-flex; }
button.kpi:hover .kpi-go { color: var(--brand-2); }
.kpi-value { font-size: 30px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; margin-top: 2px; }
.kpi-sub { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.grp-title { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 2px 2px -4px; }

.grid-rank { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.stack { display: grid; gap: 14px; }

/* ---------- Gráficos de barras ---------- */
.legend { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; background: var(--c); flex: none; display: inline-block; }

.brow, .mgroup {
  display: grid; grid-template-columns: 74px minmax(0, 1fr); align-items: center; gap: 10px;
  width: 100%; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 5px 6px; color: inherit;
}
.brow:hover, .mgroup:hover { background: #f3f5f9; }
.brow.is-active, .mgroup.is-active { background: var(--brand-tint); border-color: #c9d7f8; }
.brow[disabled] { cursor: default; }
.brow-label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.track { border-left: 1px solid var(--line-strong); min-height: 22px; display: flex; align-items: center; gap: 8px; min-width: 0; }
/* barras mensais: a largura é a fração --r do espaço livre; o valor fica na ponta da barra */
.brow .track .bar, .mgroup .track .bar { width: calc((100% - 62px) * var(--r, 0)); flex: none; }
.bar { display: flex; height: 12px; min-width: 0; }
.bar > i { display: block; height: 100%; flex: 1 1 0; min-width: 2px; background: var(--c); margin-left: 2px; }
.bar > i:first-child { margin-left: 0; }
.bar > i:last-child { border-radius: 0 6px 6px 0; }
.bar.solid { background: var(--c); border-radius: 0 6px 6px 0; }
.bval { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.mgroup .bval { font-size: 13px; }
.mgroup .bval .sw { width: 9px; height: 9px; border-radius: 50%; }
.mgroup .tracks { display: grid; gap: 4px; }
.mgroup .track { min-height: 14px; }
.mgroup .bar { height: 9px; }

.rrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "l v" "b b"; gap: 4px 10px; width: 100%; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 7px 8px; color: inherit; }
button.rrow:hover { background: #f3f5f9; }
.rrow.is-active { background: var(--brand-tint); border-color: #c9d7f8; }
.rrow .rl { grid-area: l; font-size: 13.5px; font-weight: 600; overflow-wrap: anywhere; }
.rrow .rv { grid-area: v; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; white-space: nowrap; }
.rrow .rv small { font-weight: 500; color: var(--ink-2); font-size: 12px; margin-left: 4px; }
.rrow .track { grid-area: b; }
.rank-list { display: grid; gap: 2px; }
.more { margin-top: 8px; }
.note { font-size: 13px; color: var(--ink-2); margin-top: 10px; }
.note.warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 8px 10px; }

/* ---------- Tabelas ---------- */
.table-wrap { overflow: auto; max-width: 100%; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 7px 8px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
thead th { position: sticky; top: 0; background: #f7f8fa; font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); white-space: nowrap; z-index: 1; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:hover td { background: #f8fafc; }
tfoot td { font-weight: 700; background: #f7f8fa; }
.tag { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 600; background: #eef1f5; color: var(--ink-2); white-space: nowrap; }
.tag.exec { background: #dfeafa; color: #12437f; }
.tag.exoc { background: #fde7dd; color: #8a3410; }
.tag.neg { background: #d9f3e9; color: #0b5a3d; }
.tag.termo { background: #e6e2f7; color: #372a86; }
.tag.sem { background: #fbe3ec; color: #8c2450; }
.detail-row td { background: #f7f8fa; padding: 0; }
.detail-inner { position: sticky; left: 0; padding: 12px 14px; box-sizing: border-box; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px 18px; }
.detail-grid dt { font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
.detail-grid dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.expander { border: 0; background: transparent; padding: 2px 6px; border-radius: 6px; font-weight: 700; color: var(--brand-2); }
.expander:hover { background: var(--brand-tint); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: end; }
.toolbar .field { flex: 1 1 200px; }
.toolbar .field.grow { flex: 2 1 260px; }
.pager { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
.pager .btns { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- Base e regras ---------- */
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checks li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 8px 10px; border-radius: 10px; background: #f7f8fa; }
.checks .ok { color: var(--ok-ink); }
.checks .bad { color: var(--err-ink); }
.rules h3 { font-size: 14px; margin: 14px 0 4px; }
.rules p, .rules li { font-size: 14px; color: var(--ink); }
.rules ul { margin: 4px 0 0; padding-left: 20px; display: grid; gap: 3px; }
.rules code, code { background: #eef1f5; padding: 1px 5px; border-radius: 5px; font-size: 13px; }
.kv { display: grid; grid-template-columns: minmax(max-content, 34%) minmax(0, 1fr); gap: 4px 14px; font-size: 14px; }
.kv dt { overflow-wrap: anywhere; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; overflow-wrap: anywhere; }

/* ---------- Vazio ---------- */
.empty { text-align: center; padding: 36px 18px; display: grid; gap: 10px; justify-items: center; }
.empty h2 { font-size: 20px; }
.empty p { color: var(--ink-2); max-width: 62ch; }
.empty ol { text-align: left; color: var(--ink-2); max-width: 62ch; padding-left: 20px; margin: 4px 0; }

/* ---------- Dica flutuante ---------- */
#tip {
  position: fixed; z-index: 50; pointer-events: none; background: #1b1b1a; color: #fff; padding: 8px 10px; border-radius: 8px;
  font-size: 12.5px; line-height: 1.4; max-width: min(320px, calc(100vw - 16px)); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
}
#tip strong { display: block; font-size: 13px; }

/* ---------- Responsivo ---------- */
@media (min-width: 720px) {
  .kpis-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .kpis-5 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .filters { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .topbar-in, .main-col { padding-left: 24px; padding-right: 24px; }
}
@media (max-width: 959px) {
  .actions { width: 100%; margin-left: 0; }
  .actions .btn { flex: 1 1 auto; }
  .actions .sep { display: none; }
}
@media (min-width: 960px) {
  .filters { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .filters .field.wide { grid-column: auto; }
}
@media (min-width: 1280px) {
  .kpis-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .kpi-value { font-size: 28px; }
}
@media (min-width: 760px) {
  .grid-rank { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .kv { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .kv dd { margin-bottom: 8px; }
}
@media (max-width: 420px) {
  .brow, .mgroup { grid-template-columns: 62px minmax(0, 1fr); gap: 6px; }
  .kpi-value { font-size: 26px; }
  .actions { width: 100%; margin-left: 0; }
  .actions .btn { flex: 1 1 calc(50% - 8px); padding: 6px 4px; font-size: 12.5px; gap: 6px; min-width: 0; }
  .actions .sep { display: none; }
}
@media (forced-colors: active) {
  .bar > i, .bar.solid, .sw { forced-color-adjust: none; border: 1px solid CanvasText; }
}
.kpi-groups { display: grid; gap: 10px; }
.kpi.static { cursor: default; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--brand-2); font-weight: 600; text-align: left; text-decoration: underline; text-decoration-color: transparent; }
.linkbtn:hover { text-decoration-color: currentColor; }
tr.is-active th, tr.is-active td { background: var(--brand-tint); }
.prod { display: inline-flex; align-items: center; justify-content: flex-end; gap: 8px; width: 100%; }
.prodbar { display: inline-block; height: 8px; background: var(--atv); border-radius: 0 4px 4px 0; }
.print-head { display: none; }

/* ---------- Impressão / PDF: A4 paisagem com o painel da Visão geral ---------- */
@page { size: A4 landscape; margin: 9mm; }
@media print {
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .topbar, .srcline, .actions, .filters, .skip, #status, #chips, #tip, .more, .kpi-go, #view-analitico, #view-bases, #view-base, .expander { display: none !important; }
  .app { display: block; }
  .main-col { max-width: none; }
  .grp-title { display: none; }
  .main-col { padding: 0; gap: 8px; }
  body { background: #fff; font-size: 12px; }
  .print-head { display: block; margin-bottom: 6px; }
  .print-head h1 { font-size: 20px; }
  .print-head p { color: var(--ink-2); font-size: 11.5px; margin-top: 2px; }
  .card, .kpi { box-shadow: none; border: 1px solid #c9c8c0; break-inside: avoid; }
  .kpi-value { font-size: 24px; }
  .kpis-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .kpis-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .grid-rank { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .table-wrap { overflow: visible; max-height: none !important; }
  table { font-size: 10.5px; }
  th, td { padding: 4px 6px; }
  .brow, .mgroup, .rrow, tr { break-inside: avoid; }
  .card h2 { font-size: 14px; }
  /* disposição: todos os blocos em largura total */
  #view-geral > .stack { display: grid !important; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  #view-geral > .stack > * { grid-column: 1 / -1; }
  .main-col { zoom: 0.8; }
  /* versão compacta para caber em poucas páginas */
  .card { padding: 9px 11px; }
  .card-head { margin-bottom: 6px; }
  .kpi { padding: 8px 10px 7px; }
  .kpi-label { min-height: 0; }
  .stack { gap: 0; }
  .brow, .mgroup { padding: 1px 4px; gap: 6px; }
  .track { min-height: 13px; }
  .bar { height: 11px; }
  .mgroup .track { min-height: 9px; }
  .mgroup .bar { height: 7px; }
  .mgroup .tracks { gap: 1px; }
  .bval { font-size: 11px; }
  .legend { margin-bottom: 4px; }
  .rrow { padding: 2px 6px; gap: 2px 8px; }
  .rrow .rl, .rrow .rv { font-size: 11px; }
  .rank-list { gap: 0; }
  .note { margin-top: 6px; font-size: 11px; }
}
.avancado > summary { cursor: pointer; list-style-position: inside; padding: 2px 0; }
.avancado[open] > summary { margin-bottom: 4px; }
.avancado .card { box-shadow: none; }

/* ---------- Bases de campo ---------- */
.pasta { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); min-width: 0; }
.pasta > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px 16px; font-weight: 700; border-radius: var(--radius); }
.pasta > summary::-webkit-details-marker { display: none; }
.pasta > summary:hover { background: #f3f5f9; }
.pasta > summary .ico { color: var(--muted); }
.pasta > summary .ico:first-child { transition: transform 0.12s; }
.pasta[open] > summary .ico:first-child { transform: rotate(90deg); }
.pasta-nome { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.pasta-cont { font-size: 12.5px; font-weight: 600; color: var(--muted); background: #eef1f5; border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.pasta-corpo { display: grid; gap: 12px; padding: 4px 14px 14px; min-width: 0; }
.pasta-dia { box-shadow: none; background: #fbfcfe; }
.pasta-dia > summary { font-size: 14px; padding: 10px 14px; }
.basecard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 14px; min-width: 0; box-shadow: var(--shadow); }
.basehead { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-start; justify-content: space-between; }
.basetitle { min-width: 0; flex: 1 1 260px; }
.basetitle h3 { font-size: 15px; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.basetitle .hint { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.basetools { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; }
.datefield { display: grid; gap: 2px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.datefield input { min-height: 32px; padding: 3px 8px; border: 1px solid var(--line-strong); border-radius: 9px; background: #fff; }
.progresso { display: flex; align-items: center; gap: 12px; }
.progresso-bar { flex: 1 1 auto; height: 10px; border-radius: 999px; background: #e9edf3; overflow: hidden; }
.progresso-bar > span { display: block; height: 100%; background: var(--exec); border-radius: 999px; }
.progresso-txt { font-size: 13px; font-weight: 700; white-space: nowrap; }
.minis { display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.mini { background: #f7f8fa; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.mini-label { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--muted); }
.mini-value { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
.mini-sub { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
@media (min-width: 720px) {
  .minis-base { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .minis-res { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (min-width: 1200px) {
  .minis-res { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .mini-value { font-size: 20px; }
}
@media (max-width: 420px) {
  .basetools .btn { flex: 1 1 auto; }
}
@media (max-width: 560px) {
  .tabs button { white-space: normal; text-align: center; flex: 1 1 auto; line-height: 1.2; padding: 7px 6px; font-size: 13px; }
}

/* ---------- Recortes da base ---------- */
.recorte { display: grid; gap: 14px 24px; grid-template-columns: minmax(0, 1fr); background: #f7f8fa; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.recorte-res { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.recorte-tipos { display: grid; gap: 8px; align-content: start; min-width: 0; }
.rc-row { display: grid; grid-template-columns: minmax(110px, 190px) minmax(0, 1fr) auto; align-items: center; gap: 10px; font-size: 13.5px; }
.rc-nome { font-weight: 600; overflow-wrap: anywhere; }
.rc-track { height: 10px; border-radius: 999px; background: #e9edf3; overflow: hidden; }
.rc-track > span { display: block; height: 100%; background: var(--exoc); border-radius: 999px; }
.rc-val { font-weight: 700; white-space: nowrap; }
@media (min-width: 720px) { .recorte { grid-template-columns: minmax(200px, 280px) minmax(0, 1fr); } }
@media (max-width: 480px) { .rc-row { grid-template-columns: minmax(0, 1fr) auto; } .rc-track { grid-column: 1 / -1; grid-row: 2; } }

/* ---------- Valores negociados (débito informado por mês) ---------- */
.vn-grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); }
.vn-item { background: #f7f8fa; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.vn-item.is-total { background: var(--brand-tint); border-color: #c9d7f8; }
.vn-mes { font-size: 12px; font-weight: 600; color: var(--muted); }
.vn-valor { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; white-space: nowrap; }

/* ---------- Pós-corte por categoria ---------- */
.destaque { margin: 0 0 12px; padding: 10px 14px; background: var(--brand-tint); border: 1px solid #c9d7f8; border-radius: 10px; color: var(--ink); }
.destaque strong { color: var(--brand-2); }
.catbar { background: var(--exec); }
tr.is-top th, tr.is-top td { background: #f4f8ff; }
tr.is-top th { color: var(--brand-2); }
