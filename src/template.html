<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pós-Corte Interior</title>
<meta name="description" content="Pós-Corte Interior: percorrido, Exec, Exoc, assertividade, efetividade, equipes e resultados por cidade, atualizado por arquivos Excel de uma pasta do OneDrive.">

<div class="app">
  <header class="topbar">
    <div class="topbar-in">
      <div class="title">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 20v-8"/><path d="M12 20V4"/><path d="M19 20v-5"/></svg></span>
        <div>
          <h1>Pós-Corte Interior</h1>
          <div class="sub" id="top-sub">Percorrido, Exec, Exoc, assertividade, efetividade e equipes</div>
        </div>
      </div>
      <nav class="tabs" id="nav-tabs" aria-label="Seções"></nav>
      <div class="actions">
        <button class="btn" id="btn-pasta" type="button"></button>
        <button class="btn" id="btn-atualizar" type="button"></button>
        <button class="btn" id="btn-importar" type="button"></button>
        <span class="sep" aria-hidden="true"></span>
        <button class="btn" id="btn-excel" type="button"></button>
        <button class="btn" id="btn-pdf" type="button"></button>
      </div>
    </div>
  </header>

  <div class="main-col">
    <div class="print-head" id="print-head" aria-hidden="true"></div>
    <div class="srcline" id="side-foot"></div>
    <div id="status" aria-live="polite"></div>

    <section class="filters" id="filters" aria-label="Filtros" hidden>
      <div class="field"><label for="f-from">Data inicial</label><input type="date" id="f-from"></div>
      <div class="field"><label for="f-to">Data final</label><input type="date" id="f-to"></div>
      <div class="field"><label for="f-cidade">Cidade</label><select id="f-cidade"></select></div>
      <div class="field"><label for="f-frente">Frente de serviço</label><select id="f-frente"></select></div>
      <div class="field"><label for="f-equipe">Equipe (recurso)</label><select id="f-equipe"></select></div>
      <div class="field" id="f-ind-wrap"><label for="f-ind">Indicador dos gráficos</label><select id="f-ind"></select></div>
    </section>
    <div class="chips" id="chips" aria-label="Filtros aplicados"></div>

    <main id="main" tabindex="-1">
      <section id="view-geral" aria-label="Visão geral"></section>
      <section id="view-analitico" aria-label="Analítico" hidden></section>
      <section id="view-base" aria-label="Arquivos e regras" hidden></section>
    </main>
  </div>
</div>

<input type="file" id="inp-files" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" multiple hidden>
<input type="file" id="inp-folder" webkitdirectory multiple hidden>

</html>
