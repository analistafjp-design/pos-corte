<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mensal Comercial — Painel de decisão</title>
<meta name="description" content="Corte, religação, pós-corte e negociações: execução, valores negociados, metas e conferência dos números.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1544'/%3E%3Crect x='7' y='16' width='4' height='9' rx='1' fill='%2386b6ef'/%3E%3Crect x='14' y='10' width='4' height='15' rx='1' fill='%233987e5'/%3E%3Crect x='21' y='6' width='4' height='19' rx='1' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme: light;
  --page:#f2f3f7; --surface:#fcfcfb; --surface-2:#f5f5f2; --ink:#0b0b0b; --ink-2:#4a4944; --ink-3:#66655f;
  --grid:#e1e0d9; --axis:#c3c2b7; --hair:rgba(11,11,11,.10); --shadow:0 1px 2px rgba(13,21,68,.06),0 4px 16px rgba(13,21,68,.05);
  --brand:#0d1544; --brand-2:#18227a; --on-brand:#fff; --on-brand-2:#c9d2ff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --t1:#1c5cab; --t2:#3987e5; --t3:#86b6ef; --on-t1:#fff; --on-t2:#0b0b0b; --on-t3:#0b0b0b;
  --track:#e6eefb;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --info:#2a78d6;
  --chip-bg:#eef0f6; --sel:#e8f0fd; --focus:#2a78d6;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#222221; --ink:#fff; --ink-2:#c3c2b7; --ink-3:#a19f96;
    --grid:#2c2c2a; --axis:#383835; --hair:rgba(255,255,255,.10); --shadow:none;
    --brand:#0a0f33; --brand-2:#131b5c;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --t1:#86b6ef; --t2:#3987e5; --t3:#1c5cab; --on-t1:#0b0b0b; --on-t2:#0b0b0b; --on-t3:#fff;
    --track:#22304a; --chip-bg:#262625; --sel:#1f2b40; --focus:#6da7ec;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#222221; --ink:#fff; --ink-2:#c3c2b7; --ink-3:#a19f96;
  --grid:#2c2c2a; --axis:#383835; --hair:rgba(255,255,255,.10); --shadow:none;
  --brand:#0a0f33; --brand-2:#131b5c;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --t1:#86b6ef; --t2:#3987e5; --t3:#1c5cab; --on-t1:#0b0b0b; --on-t2:#0b0b0b; --on-t3:#fff;
  --track:#22304a; --chip-bg:#262625; --sel:#1f2b40; --focus:#6da7ec;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1360px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- cabeçalho ---------- */
header.top{background:linear-gradient(180deg,var(--brand),var(--brand-2));color:var(--on-brand);position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.top .row1{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:12px 0 6px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{font-size:20px;line-height:1.15;margin:0;font-weight:650;letter-spacing:.1px}
.brand p{margin:0;color:var(--on-brand-2);font-size:12.5px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip-top{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--on-brand);white-space:nowrap}
.chip-top b{font-weight:650}
.btn{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);color:var(--on-brand);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:rgba(255,255,255,.2)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-top:4px}
nav.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:transparent;border:0;color:var(--on-brand-2);padding:10px 14px;cursor:pointer;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:#fff;font-weight:650}
.badge{background:var(--serious);color:#0b0b0b;border-radius:999px;font-size:11.5px;font-weight:700;padding:0 7px;line-height:18px;min-width:18px;text-align:center}

/* ---------- filtros ---------- */
.filters{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 0 4px}
.filters label{display:flex;gap:8px;align-items:center;color:var(--ink-2);font-size:13px}
.filters select,.filters input[type=number]{background:var(--surface);border:1px solid var(--hair);border-radius:8px;padding:6px 10px;min-height:34px}
.filters .spacer{flex:1}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--sel);border:1px solid var(--hair);border-radius:999px;padding:3px 6px 3px 12px;font-size:13px}
.pill button{border:0;background:transparent;cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;border-radius:999px;color:var(--ink-2)}
.pill button:hover{background:var(--hair)}

/* ---------- layout ---------- */
main{padding:6px 0 48px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.gk{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.mt{margin-top:14px}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:14px;box-shadow:var(--shadow);padding:16px;min-width:0}
.card h2{font-size:15px;margin:0;font-weight:650}
.card .sub{margin:2px 0 0;color:var(--ink-3);font-size:12.5px}
.card-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap}
.sec-title{margin:22px 0 8px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:650}

/* ---------- indicadores ---------- */
.kpi{background:var(--surface);border:1px solid var(--hair);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;position:relative;min-width:0}
.kpi .l{color:var(--ink-2);font-size:13px}
.kpi .v{font-size:30px;font-weight:650;line-height:1.15;margin:4px 0 2px;letter-spacing:-.3px}
.kpi .s{color:var(--ink-3);font-size:12.5px}
.kpi.tone-atencao{border-left:4px solid var(--warn)}
.kpi.tone-critico{border-left:4px solid var(--crit)}
.kpi.tone-bom{border-left:4px solid var(--good)}
.hero{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border:0;border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;min-width:0}
.hero .l{color:var(--on-brand-2);font-size:13.5px}
.hero .v{font-size:56px;font-weight:650;line-height:1.05;margin:6px 0;letter-spacing:-1px}
.hero .s{color:#e4e9ff;font-size:13.5px}
.meter{position:relative;height:10px;border-radius:999px;background:rgba(255,255,255,.22);margin:12px 0 4px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:#fff}
.meter u{position:absolute;top:-4px;bottom:-4px;width:2px;background:rgba(255,255,255,.75);text-decoration:none}
.meter-l{position:relative;height:16px;color:#c9d2ff;font-size:11.5px}
.meter-l span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.top-grid{display:grid;gap:14px;grid-template-columns:minmax(260px,1fr) 2fr}
@media (max-width:900px){.top-grid{grid-template-columns:1fr}}

/* ---------- situação (ícone + texto, nunca só cor) ---------- */
.st{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;white-space:nowrap}
.st i{font-style:normal;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:800;color:#0b0b0b;flex:none}
.st.bom i{background:var(--good)} .st.atencao i{background:var(--warn)} .st.critico i{background:var(--crit);color:#fff}
.st.info i{background:var(--info);color:#fff} .st.sem i{background:var(--axis)} .st.alerta i{background:var(--serious)}

/* ---------- destaques ---------- */
.dest{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.dest li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 12px;background:var(--surface-2);border-radius:10px;border:1px solid var(--hair)}
.dest .t{font-weight:600}
.dest .d{color:var(--ink-2);font-size:13px}
.dest button.go{border:1px solid var(--hair);background:var(--surface);border-radius:8px;padding:4px 9px;cursor:pointer;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.dest button.go:hover{background:var(--sel)}

/* ---------- tabelas ---------- */
.tw{overflow-x:auto;background:linear-gradient(to right,var(--surface) 30%,transparent),linear-gradient(to left,var(--surface) 30%,transparent) right,radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.16),transparent),radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.16),transparent) right;background-repeat:no-repeat;background-size:36px 100%,36px 100%,12px 100%,12px 100%;background-attachment:local,local,scroll,scroll}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--grid);vertical-align:middle;white-space:nowrap}
td.w{white-space:normal;min-width:150px}
thead th{color:var(--ink-3);font-weight:600;font-size:12px;white-space:nowrap;position:sticky;top:0;background:var(--surface)}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th button:hover{color:var(--ink)}
th button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
tbody tr.clic{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr.sel td{background:var(--sel)}
tfoot td{font-weight:650;border-top:2px solid var(--axis);border-bottom:0}
td .nome{font-weight:500}
td.dim{color:var(--ink-3)}
.bar-wrap{display:flex;align-items:center;gap:8px;min-width:96px}
.bar.lt{opacity:.62}
table.compacta .bar-track{flex:0 0 56px;min-width:56px}
.bar-track{flex:1;display:flex;gap:2px;height:12px;min-width:40px}
.bar{height:12px;border-radius:0 4px 4px 0;min-width:2px}
.seg{height:12px;min-width:2px}
.seg:first-child{border-radius:0}
.seg:last-child{border-radius:0 4px 4px 0}
.bar-wrap .val{min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.c1{background:var(--s1)} .c2{background:var(--s2)} .c3{background:var(--s3)} .ct1{background:var(--t1);color:var(--on-t1)} .ct2{background:var(--t2);color:var(--on-t2)} .ct3{background:var(--t3);color:var(--on-t3)} .cg{background:var(--axis)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin:2px 0 8px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.stack{display:flex;gap:2px;height:26px;margin:6px 0}
.stack div{display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;min-width:2px;overflow:hidden}
.stack div:first-child{border-radius:6px 0 0 6px}.stack div:last-child{border-radius:0 6px 6px 0}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--hair);border-radius:10px;padding:9px 12px;margin-top:10px}
.note b{font-weight:650}
.seg-ctl{display:inline-flex;border:1px solid var(--hair);border-radius:9px;overflow:hidden}
.seg-ctl button{background:var(--surface);border:0;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.seg-ctl button[aria-pressed="true"]{background:var(--sel);color:var(--ink);font-weight:650}
.seg-ctl button+button{border-left:1px solid var(--hair)}
.exp{all:unset;cursor:pointer;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;border:1px solid var(--hair);margin-right:6px;font-size:13px;line-height:1}
.exp:focus-visible{outline:2px solid var(--focus)}
tr.filho td:first-child{padding-left:38px}
tr.filho td{color:var(--ink-2)}

/* ---------- conferência / dicionário ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--hair);background:var(--chip-bg);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--sel);font-weight:650;border-color:var(--focus)}
.conf{display:grid;gap:8px;margin-top:10px}
.conf details{background:var(--surface-2);border:1px solid var(--hair);border-radius:10px;padding:0}
.conf summary{list-style:none;cursor:pointer;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.conf summary::-webkit-details-marker{display:none}
.conf summary .t{font-weight:600}
.conf .corpo{padding:0 14px 12px 40px;color:var(--ink-2);font-size:13px;display:grid;gap:6px}
.conf .eq{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.conf .eq div{background:var(--surface);border:1px solid var(--hair);border-radius:8px;padding:6px 10px}
.conf .eq small{display:block;color:var(--ink-3);font-size:11.5px}
.search{width:min(100%,360px);background:var(--surface);border:1px solid var(--hair);border-radius:8px;padding:7px 10px}
.dic td:first-child{font-weight:600;min-width:170px}
.dic td{vertical-align:top;white-space:normal}
.dic th{white-space:nowrap}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.small{font-size:12.5px;color:var(--ink-3)}
.vazio{padding:18px;text-align:center;color:var(--ink-3)}
.erro{background:color-mix(in srgb,var(--crit) 14%,var(--surface));border:1px solid var(--crit);border-radius:10px;padding:10px 12px;margin:12px 0}

/* ---------- dica ---------- */
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--surface);padding:7px 10px;border-radius:8px;font-size:12.5px;line-height:1.35;max-width:300px;white-space:pre-line;box-shadow:0 6px 20px rgba(0,0,0,.28);opacity:0;transition:opacity .08s}
#tip.on{opacity:1}
#tip b{font-size:14px}

footer.pe{color:var(--ink-3);font-size:12.5px;padding:8px 0 36px}
[hidden]{display:none!important}

@media (max-width:640px){
  .lbl{display:none}
  .btn{padding:7px 11px;font-size:15px}
  .top .row1{padding:10px 0 4px;gap:8px}
  .filters .hint{display:none}
  .gk{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{padding:12px}
  .kpi .v{font-size:23px}
  .bar-wrap{min-width:0;gap:6px}
  .bar-track{flex:0 0 44px;min-width:44px}
  th,td{padding:7px 7px}
  .brand h1{font-size:18px}
  .hero .v{font-size:46px}
  .kpi .v{font-size:26px}
  .card{padding:13px}
  .dest li{grid-template-columns:auto 1fr}
  .dest button.go{grid-column:2;justify-self:start}
}
@media print{
  header.top{position:static;background:none;color:#000;box-shadow:none}
  .top-actions,nav.tabs,.filters .spacer,#tip,.btn,.seg-ctl,.exp,.go{display:none!important}
  body{background:#fff}
  .card,.kpi{box-shadow:none;break-inside:avoid}
  .hero{background:#fff;color:#000;border:1px solid #999}.hero .l,.hero .s,.meter-l{color:#333}.meter{background:#ddd}.meter i{background:#333}
  .brand p{color:#333}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</header>
<div class="wrap">

</div>

   5. Destaques (frases geradas dos dados)
   ===================================================================== */
function destaques(C,conf){
  const {D,S,tot,N}=C, L=[]; const P=(tom,aba,titulo,texto)=>L.push({tom,aba,titulo,texto});
  P(tomTaxa(C,tot.taxa),'resumo',`Taxa de execução de ${fPct(tot.taxa)} no dia`,`${fInt(tot.exec)} de ${fInt(tot.perc)} O.S. percorridas foram executadas; ${fInt(tot.exoc)} terminaram com ocorrência (${fPct(div(tot.exoc,tot.perc))}).`);
  const pior=[...S].filter(s=>s.perc>=20).sort((a,b)=>a.taxa-b.taxa)[0];
  if(pior){ const parte=div(pior.exoc,tot.exoc); P(tomTaxa(C,pior.taxa),'resumo',`${bonito(pior.nome)} tem a menor taxa: ${fPct(pior.taxa)}`,`Concentra ${fInt(pior.exoc)} das ${fInt(tot.exoc)} ocorrências do dia (${fPct(parte,0)}). É onde mais se perde execução.`); }
  const mot=[...D.motivos_nao_execucao].sort((a,b)=>b.qtd-a.qtd), mt=sum(mot,m=>m.qtd), top4=sum(mot.slice(0,4),m=>m.qtd);
  P('atencao','resumo',`4 motivos respondem por ${fPct(div(top4,mt),0)} das não execuções`,mot.slice(0,4).map(m=>bonito(m.motivo.replace('…','')).trim()+'… ('+m.qtd+')').join(', ')+'. Atacar esses motivos reduz mais ocorrências.');
  const cid=[...C.cidades].sort((a,b)=>b.valor-a.valor), top3=cid.slice(0,3), p3=div(sum(top3,c=>c.valor),C.negVal);
  P('info','negociacoes',`3 cidades concentram ${fPct(p3,0)} do valor negociado`,top3.map(c=>`${c.nome} (${fBRLc(c.valor)})`).join(', ')+`. Restante: ${fBRLc(C.negVal-sum(top3,c=>c.valor))} em ${cid.length-3} cidades.`);
  const maiorTk=[...C.cidades].sort((a,b)=>b.ticket-a.ticket)[0], tkMed=div(C.negVal,C.negQtd);
  P('info','negociacoes',`${maiorTk.nome}: ${fInt(maiorTk.qtd)} negociações, mas o maior valor por negociação`,`Ticket de ${fBRL(maiorTk.ticket)}, ${fDec(maiorTk.ticket/tkMed,1)} vezes o ticket médio (${fBRL(tkMed)}). Já ${C.cidades.slice().sort((a,b)=>b.qtd-a.qtd)[0].nome} lidera em quantidade (${fInt(C.cidades.slice().sort((a,b)=>b.qtd-a.qtd)[0].qtd)}) com ticket de ${fBRL(C.cidades.slice().sort((a,b)=>b.qtd-a.qtd)[0].ticket)}.`);
  const fr=C.frentesNeg.find(f=>/corte/i.test(f.frente));
  if(fr) P('atencao','negociacoes',`${fr.frente}: ${fPct(fr.parteQtd,0)} das negociações, ${fPct(fr.parteVal,0)} do valor`,`${fInt(fr.qtd)} negociações somam ${fBRLc(fr.valor)} (ticket ${fBRL(fr.ticket)}). A frente Leitura tem ${fPct(C.frentesNeg.find(f=>/leitura/i.test(f.frente)).parteQtd,0)} das negociações, com ticket bem menor.`);
  const eq2=C.equipes.slice().sort((a,b)=>b.valor-a.valor).slice(0,2);
  P('info','negociacoes',`2 equipes geram ${fPct(div(sum(eq2,e=>e.valor),N.resumo_report.valor),0)} do valor negociado`,eq2.map(e=>`${e.recurso} (${fInt(e.qtd)} negociações, ${fBRLc(e.valor)})`).join(' e ')+'. Vale entender o que essas equipes fazem diferente.');
  const abaixo=C.metas.filter(m=>m.real!=null&&m.ating<C.lim.meta.atencao&&m.grupo!=='Negociação');
  const acima=C.metas.filter(m=>m.real!=null&&m.ating>=C.lim.meta.bom);
  if(abaixo.length) P('atencao','metas',`${abaixo.length} ${plural(abaixo.length,'meta está','metas estão')} abaixo do ritmo diário de referência`,abaixo.map(m=>`${m.rotulo} (${fPct(m.ating,0)})`).join('; ')+`. Referência = orçado ÷ ${C.dias} dias úteis; confirmar se o orçado é mensal.`);
  if(acima.length) P('bom','metas',`${acima.length} ${plural(acima.length,'meta acima','metas acima')} do ritmo diário de referência`,acima.map(m=>`${m.rotulo} (${fPct(m.ating,0)})`).join('; ')+'.');
  const comMeta=new Set(D.metas.map(m=>m.servico).filter(Boolean)), sem=S.filter(s=>!comMeta.has(s.nome));
  P('info','metas',`${fPct(div(sum(sem,s=>s.exec),tot.exec),0)} das execuções estão em serviços sem meta no relatório`,sem.map(s=>bonito(s.nome)).join(', ')+`: ${fInt(sum(sem,s=>s.exec))} de ${fInt(tot.exec)} execuções.`);
  const al=conf.filter(c=>c.status==='alerta').length;
  P(al?'alerta':'bom','conferencia',`${al} ${plural(al,'divergência','divergências')} entre os números do relatório original`,'Alguns totais mudam de uma página para outra (ex.: 131 × 132 negociações; 66 motivos × 45 ocorrências). Veja a aba Conferência antes de usar esses números em decisões.');
  return L;
}

/* Tabela genérica: colunas clicáveis para ordenar, barras nas células, rodapé e linha em foco */
function tabela(cfg){
  let ord=cfg.ordem?{...cfg.ordem}:null; const cols=cfg.colunas;
  const tw=h('div',{class:'tw'}); const tb=h('tbody'); const thead=h('thead'); const tr0=h('tr');
  const setas=()=>{ tr0.querySelectorAll('th').forEach((th,i)=>{ const c=cols[i]; th.setAttribute('aria-sort', ord&&ord.k===c.k?(ord.dir>0?'ascending':'descending'):'none'); const sp=th.querySelector('.seta'); if(sp) sp.textContent=ord&&ord.k===c.k?(ord.dir>0?'▲':'▼'):''; }); };
  cols.forEach(c=>{ const th=h('th',{class:c.tipo==='num'?'n':'','data-tip':c.dica||null,scope:'col'});
    if(c.ordenar===false||!cfg.linhas.length) th.appendChild(document.createTextNode(c.rotulo));
    else th.appendChild(h('button',{type:'button',on:{click:()=>{ ord=ord&&ord.k===c.k?{k:c.k,dir:-ord.dir}:{k:c.k,dir:c.tipo==='num'?-1:1}; corpo(); }}},c.rotulo,h('span',{class:'seta','aria-hidden':'true'})));

  const d=DIC.filter(ok), m=MAPA.filter(ok);
  return frag(h('div',{class:'mt'},card('Dicionário de indicadores',{sub:'O que cada número significa, como é calculado e como se chamava no relatório original.',acoes:busca},
      h('div',{class:'tw'},h('table',{class:'dic'},h('thead',null,h('tr',null,['Neste painel','No relatório original','O que significa','Como se calcula','Onde aparece'].map(t=>h('th',{scope:'col'},t)))),h('tbody',null,d.length?d.map(r=>h('tr',null,r.map((c,i)=>h('td',{class:i===3?'mono':''},c)))):h('tr',null,h('td',{colspan:'5',class:'vazio'},'Nada encontrado.'))))))),
    h('div',{class:'mt'},card('Mapa do relatório original (PDF)',{sub:'Páginas, visuais e campos, para localizar de onde vem cada número.'},
      h('div',{class:'tw'},h('table',{class:'dic'},h('thead',null,h('tr',null,['Página','Visual','Campos / medidas','Observação'].map(t=>h('th',{scope:'col'},t)))),h('tbody',null,m.length?m.map(r=>h('tr',null,r.map(c=>h('td',null,c)))):h('tr',null,h('td',{colspan:'4',class:'vazio'},'Nada encontrado.'))))))),
    h('div',{class:'mt'},card('Regras impressas no rodapé do relatório',{},h('ul',{style:'margin:0;padding-left:18px'},C.D.regras_rodape.map(t=>h('li',null,t))))));
}

/* =====================================================================
   8. Navegação, cabeçalho, filtros e ações
   ===================================================================== */
const ABAS=[['resumo','Resumo do dia',vResumo],['operacao','Corte e religação',vOperacao],['negociacoes','Negociações',vNegociacoes],['metas','Metas',vMetas],['conferencia','Conferência',vConferencia],['dicionario','Dicionário',vDicionario]];
function irPara(id){ S.aba=id; try{history.replaceState(null,'','#'+id);}catch(_){} renderTudo(); window.scrollTo({top:0}); }
function renderTabs(){
  const nav=document.getElementById('tabs'); nav.replaceChildren();
  ABAS.forEach(([id,rot],i)=>{ const al=CONF.filter(c=>c.status==='alerta').length;
    nav.appendChild(h('button',{class:'tab',role:'tab',id:'tab-'+id,'aria-selected':String(S.aba===id),'aria-controls':'main',tabindex:S.aba===id?'0':'-1',on:{click:()=>irPara(id),keydown:e=>{ const k={ArrowRight:1,ArrowLeft:-1}[e.key]; if(k){ e.preventDefault(); const n=ABAS[(i+k+ABAS.length)%ABAS.length][0]; irPara(n); document.getElementById('tab-'+n).focus(); } }}},rot,id==='conferencia'&&al?h('span',{class:'badge','aria-label':al+' alertas'},String(al)):null)); });
}
function renderFiltros(){
  const f=document.getElementById('filtros'); f.replaceChildren();
  const dias=Object.keys(S.snapshots).sort();
  f.appendChild(h('label',null,'Dia',h('select',{id:'selDia','aria-label':'Dia dos dados',on:{change:e=>{S.dia=e.target.value;S.diasUteis=null;recalcular();renderTudo();}}},dias.map(d=>h('option',{value:d,selected:d===S.dia?'':null},dataBR(d)+' ('+diaSemana(d)+')')))));
  const todas=[...new Set([...C.D.negociacoes.por_cidade.linhas,...C.D.corte_por_cidade.linhas].map(c=>c.cidade))].sort((a,b)=>nomeCidade(a).localeCompare(nomeCidade(b),'pt-BR'));
  f.appendChild(h('label',null,'Cidade em foco',h('select',{id:'selCidade','aria-label':'Cidade em foco',on:{change:e=>{S.cidade=e.target.value;renderTudo();}}},h('option',{value:''},'Todas'),todas.map(c=>h('option',{value:c,selected:c===S.cidade?'':null},nomeCidade(c))))));
  if(S.cidade) f.appendChild(h('span',{class:'pill'},nomeCidade(S.cidade),h('button',{type:'button','aria-label':'Limpar cidade em foco',on:{click:()=>focar(S.cidade)}},'×')));
  f.appendChild(h('span',{class:'spacer'}));
  f.appendChild(h('span',{class:'small hint'},dias.length>1?dias.length+' dias carregados':'1 dia carregado · a cidade em foco destaca linhas e abre a ficha no Resumo'));
}
function renderTopo(){
  const r=C.D.referencia; document.getElementById('chipData').replaceChildren(h('b',null,dataBR(r.data)),' · '+diaSemana(r.data)+' · '+mesBR(r.mes));
  document.getElementById('rodape').textContent='Fonte: '+r.fonte+'. Exportado em '+dataBR(r.exportado_em)+'. '+r.observacao+' Os números são os do relatório original; as taxas e proporções são recalculadas aqui e explicadas no Dicionário.';
}
function renderMain(){ const m=document.getElementById('main'); const v=ABAS.find(a=>a[0]===S.aba)[2]; m.setAttribute('role','tabpanel'); m.setAttribute('aria-labelledby','tab-'+S.aba); m.replaceChildren(v()); }
function renderTudo(){ renderTopo(); renderTabs(); renderFiltros(); renderMain(); }

function resumoTexto(){
  const t=C.tot, R=C.D.negociacoes.resumo_report, r=C.D.referencia, al=CONF.filter(c=>c.status==='alerta').length;
  return ['Mensal Comercial — '+dataBR(r.data),'',
    'Taxa de execução: '+fPct(t.taxa)+' ('+fInt(t.exec)+' executadas de '+fInt(t.perc)+' percorridas; '+fInt(t.exoc)+' com ocorrência)',
    'Negociações: '+fInt(R.qtd)+' · '+fBRL(R.valor)+' · ticket '+fBRL(R.ticket_medio),
    'Cortes: '+fInt(C.D.totais_relatorio.corte_real.valor)+' · Religações: '+fInt(C.D.totais_relatorio.relig_real.valor),'','Destaques:']
    .concat(destaques(C,CONF).map(d=>'• '+d.titulo+' — '+d.texto)).concat(['',al+' divergências entre os números do relatório original (aba Conferência).']).join('\n');
}
async function copiar(){
  const t=resumoTexto(), b=document.getElementById('btnCopiar'), ic=b.querySelector('.ic'), lb=b.querySelector('.lbl'), r0=[ic.textContent,lb.textContent];
  let ok=true;
  try{ await navigator.clipboard.writeText(t); }
  catch(_){ const ta=h('textarea',{style:'position:fixed;opacity:0'}); ta.value=t; document.body.appendChild(ta); ta.select(); try{ok=document.execCommand('copy');}catch(e){ok=false;} ta.remove(); }
  ic.textContent=ok?'✔':'!'; lb.textContent=ok?'Copiado':'Não foi possível copiar';
  setTimeout(()=>{ic.textContent=r0[0];lb.textContent=r0[1];},1800);
}
function avisar(msgs){ const a=document.getElementById('aviso'); a.replaceChildren(); if(msgs&&msgs.length) a.appendChild(h('div',{class:'erro',role:'alert'},h('b',null,'Não foi possível carregar o arquivo. '),h('ul',{style:'margin:6px 0 0;padding-left:18px'},msgs.map(m=>h('li',null,m))))); }
function importar(file){
  const rd=new FileReader(); rd.onerror=()=>avisar(['Erro ao ler o arquivo.']);
  rd.onload=()=>{ let d; try{ d=JSON.parse(rd.result); }catch(e){ return avisar(['O arquivo não é um JSON válido: '+e.message]); }
    const lote=Array.isArray(d)?d:[d]; const erros=[]; const ok=[];
    lote.forEach((x,i)=>{ const e=validar(x); if(e.length) erros.push(...e.map(m=>(lote.length>1?'Item '+(i+1)+': ':'')+m)); else ok.push(x); });
    if(erros.length) return avisar(erros);
    avisar(null); ok.forEach(x=>{S.snapshots[x.referencia.data]=x;}); S.dia=ok[ok.length-1].referencia.data; S.diasUteis=null; S.cidade=''; recalcular(); renderTudo(); };
  rd.readAsText(file);
}
function aplicarTema(t){ if(t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme'); }
function alternarTema(){ const atual=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); const novo=atual==='dark'?'light':'dark'; aplicarTema(novo); try{localStorage.setItem('mc-tema',novo);}catch(_){} }

/* =====================================================================
   9. Início
   ===================================================================== */
function iniciar(){
  try{ const t=localStorage.getItem('mc-tema'); if(t==='dark'||t==='light') aplicarTema(t); }catch(_){}
  const D=JSON.parse(document.getElementById('dados-embutidos').textContent);
  const erros=validar(D); if(erros.length){ document.getElementById('main').appendChild(h('div',{class:'erro'},'Dados embutidos inválidos: '+erros.join(' '))); return; }
  S.snapshots[D.referencia.data]=D; S.dia=D.referencia.data; recalcular();
  const hash=location.hash.replace('#',''); if(ABAS.some(a=>a[0]===hash)) S.aba=hash;
  document.getElementById('btnImportar').addEventListener('click',()=>document.getElementById('arquivo').click());
  document.getElementById('arquivo').addEventListener('change',e=>{ if(e.target.files[0]) importar(e.target.files[0]); e.target.value=''; });
  document.getElementById('btnCopiar').addEventListener('click',copiar);
  document.getElementById('btnImprimir').addEventListener('click',()=>window.print());
  document.getElementById('btnTema').addEventListener('click',alternarTema);
  window.addEventListener('hashchange',()=>{ const x=location.hash.replace('#',''); if(ABAS.some(a=>a[0]===x)&&x!==S.aba){S.aba=x;renderTudo();} });
  renderTudo();
  window.__mc={S,get C(){return C;},get CONF(){return CONF;},validar,calcular,conferencias,resumoTexto}; // apoio a testes
}
iniciar();
})();
</script>
